<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <button class="back-btn" (click)="navigateToDashboard()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="header-content">
        <div class="student-icon">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <h1>Student Login</h1>
        <p>Access your student dashboard</p>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
        </div>
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
        </div>
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="login-btn" 
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">
          <i class="fas fa-sign-in-alt"></i> Login
        </span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin"></i> Logging in...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>Don't have a student account?</p>
      <button class="register-link" (click)="navigateToRegister()">
        Register as Student
      </button>
    </div>

    <div class="demo-credentials">
      <h4>Demo Credentials:</h4>
      <p><strong>Email:</strong> student&#64;example.com</p>
      <p><strong>Password:</strong> password123</p>
    </div>
  </div>
</div>
